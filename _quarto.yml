project:
  type: website
  output-dir: docs
  post-render: touch docs/.nojekyll
  resources:
    - files/**
    - CNAME

website:
  search: false
  title: "Alexandros Kentikelenis"
  site-url: https://www.kentikelenis.net
  description: "Professor of Political Economy and Sociology, Bocconi University. Global governance, international political economy, global health and social protection."
  image: files/images/portrait.jpg
  favicon: files/images/favicon.png
  open-graph: true
  twitter-card: true
  page-navigation: false
  navbar:
    pinned: true
    logo: ""
    left:
      - text: "About"
        href: about.qmd
      - text: "Books"
        href: books.qmd
      - text: "Academic writing"
        href: academic-writing.qmd
      - text: "Policy"
        href: policy.qmd
      - text: "Media"
        href: media.qmd
      - text: "Teaching & students"
        href: teaching.qmd
      - text: "CV"
        href: cv.qmd
    right:
      - icon: envelope
        href: "mailto:alexandros.kentikelenis@unibocconi.it"
        aria-label: Email
      - icon: mortarboard-fill
        href: https://scholar.google.co.uk/citations?user=WSKvdv4AAAAJ
        aria-label: Google Scholar
      - icon: twitter-x
        href: https://x.com/Kentikelenis
        aria-label: X
      - icon: linkedin
        href: https://www.linkedin.com/in/alexandros-kentikelenis/
        aria-label: LinkedIn
      - text: <img src="data:image/png;base64," alt="ResearchGate" style="height:1.05rem;width:auto;vertical-align:middle;position:relative;top:2px;display:inline-block;">
        href: https://www.researchgate.net/profile/Alexandros-Kentikelenis
        aria-label: ResearchGate
  page-footer:
    left: "© Alexandros Kentikelenis · Bocconi University, Via Röntgen 1, 20136 Milan, Italy"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      - cosmo
      - assets/styles.scss
    toc: false
    page-layout: article
    grid:
      body-width: 760px
      margin-width: 220px
      sidebar-width: 0px
    link-external-newwindow: true
    include-after-body:
      - text: |
          <script data-newtab-script>
          // Open external links and file downloads in a new tab; keep site navigation in this tab.
          document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll("a[href]").forEach(function (a) {
              var h = a.getAttribute("href") || "";
              var external = /^https?:\/\//i.test(h) && a.hostname !== window.location.hostname;
              var isFile = /\.pdf(\?|#|$)/i.test(h);
              if (external || isFile) { a.target = "_blank"; a.rel = "noopener"; }
            });
          });
          </script>
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
      - text: |
          <script data-goatcounter="https://kentikelenis.goatcounter.com/count"
                  async src="//gc.zgo.at/count.js"></script>
